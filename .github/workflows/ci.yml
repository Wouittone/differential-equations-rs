name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings -D missing-docs

jobs:
  quality:
    name: Latest stable quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check tableau resources
        run: cargo test --locked --test tableau_resources
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Test documentation
        run: cargo test --locked --workspace --doc --all-features
      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@077fee5b0788f1a772d4c6ce2814159cd1d6632b # 1.85.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo check --locked --workspace --all-targets --no-default-features

  downstream:
    name: Downstream consumer contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@077fee5b0788f1a772d4c6ce2814159cd1d6632b # 1.85.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            tests/downstream/default-features -> target
            tests/downstream/no-default-renamed -> target
      - name: Check and test the default-feature consumer
        run: |
          cargo check --locked --manifest-path tests/downstream/default-features/Cargo.toml --all-targets
          cargo test --locked --manifest-path tests/downstream/default-features/Cargo.toml
      - name: Check and test the minimal renamed consumer
        run: |
          cargo check --locked --manifest-path tests/downstream/no-default-renamed/Cargo.toml --all-targets
          cargo test --locked --manifest-path tests/downstream/no-default-renamed/Cargo.toml

  julia-compliance:
    name: Pinned Julia SciML comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.85"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      JULIA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@077fee5b0788f1a772d4c6ce2814159cd1d6632b # 1.85.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.12.6"
      - name: Instantiate the pinned Julia environment
        run: julia --project=tests/julia --startup-file=no -e 'using Pkg; Pkg.instantiate()'
      - name: Compare against pinned SciML solvers
        run: julia --project=tests/julia --startup-file=no tests/julia/runtests.jl
      - name: Certify the matched benchmark matrix
        run: |
          cargo bench --locked --bench comparison_matrix -- --repetitions 1 > "$RUNNER_TEMP/rust-comparison.csv"
          julia --project=tests/julia --startup-file=no benches/comparison/julia_matrix.jl --repetitions 1 --mode timing > "$RUNNER_TEMP/julia-comparison.csv"
          julia --startup-file=no benches/comparison/verify_matrix.jl --rust "$RUNNER_TEMP/rust-comparison.csv" --julia "$RUNNER_TEMP/julia-comparison.csv"

  platform-smoke:
    name: ${{ matrix.os }} smoke tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --workspace --lib --no-default-features

  package:
    name: Feature boundaries and package policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test the minimal feature set
        run: cargo test --locked --workspace --all-targets --no-default-features
      - name: Check publishable package contents
        run: |
          cargo package --locked --no-verify -p differential-equations-tableau-core
          cargo package --locked --list -p differential-equations-tableau-macros
          package_files="$(cargo package --locked --list -p differential-equations-rs)"
          grep -Fxq 'benches/comparison/rust_matrix.rs' <<<"$package_files"
          grep -Fxq 'benches/solver_performance.rs' <<<"$package_files"
          grep -Fxq 'LICENSE-APACHE' <<<"$package_files"
          grep -Fxq 'LICENSE-MIT' <<<"$package_files"

  supply-chain:
    name: Advisories, licenses, bans, and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.85"
          command: check
          arguments: --all-features

