name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Format, lint, test, and document
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --locked --all-targets --all-features
      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --locked --all-targets --all-features

  package:
    name: Feature boundaries and package policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check the minimal feature set
        run: cargo check --locked --all-targets --no-default-features
      - name: Check publishable package contents
        shell: pwsh
        run: ./scripts/check_package_policy.ps1

  supply-chain:
    name: Advisories, licenses, bans, and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.85"
          command: check
          arguments: --all-features

  inventory:
    name: Check solver inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned OrdinaryDiffEq source
        run: |
          git init "$RUNNER_TEMP/OrdinaryDiffEq.jl"
          git -C "$RUNNER_TEMP/OrdinaryDiffEq.jl" remote add origin https://github.com/SciML/OrdinaryDiffEq.jl.git
          git -C "$RUNNER_TEMP/OrdinaryDiffEq.jl" fetch --depth=1 origin 211142263781255a9aa2f910f6760b9f18ec29c8
          git -C "$RUNNER_TEMP/OrdinaryDiffEq.jl" checkout --detach FETCH_HEAD
      - name: Check generated inventory
        shell: pwsh
        run: ./scripts/generate_ode_inventory.ps1 -UpstreamPath "$env:RUNNER_TEMP/OrdinaryDiffEq.jl" -RepositoryPath . -OutputDirectory docs -Check
