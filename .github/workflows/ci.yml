name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Format, lint, test, and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --locked --all-targets --all-features
      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo check --locked --all-targets --all-features

  supply-chain:
    name: Advisories, licenses, bans, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          rust-version: "1.85"
          command: check
          arguments: --all-features

  inventory:
    name: Check solver inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch pinned OrdinaryDiffEq source
        run: |
          git init "$RUNNER_TEMP/OrdinaryDiffEq.jl"
          git -C "$RUNNER_TEMP/OrdinaryDiffEq.jl" remote add origin https://github.com/SciML/OrdinaryDiffEq.jl.git
          git -C "$RUNNER_TEMP/OrdinaryDiffEq.jl" fetch --depth=1 origin 211142263781255a9aa2f910f6760b9f18ec29c8
          git -C "$RUNNER_TEMP/OrdinaryDiffEq.jl" checkout --detach FETCH_HEAD
      - name: Check generated inventory
        shell: pwsh
        run: ./scripts/generate_ode_inventory.ps1 -UpstreamPath "$env:RUNNER_TEMP/OrdinaryDiffEq.jl" -RepositoryPath . -OutputDirectory docs -Check
