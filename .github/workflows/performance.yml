name: Performance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.85"

jobs:
  codspeed:
    name: CodSpeed regression benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.85.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-codspeed
      - name: Build benchmarks
        run: cargo codspeed build --locked --bench solver_performance
      - name: Run benchmark smoke test
        if: >-
          vars.CODSPEED_ENABLED != 'true' ||
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')
        run: cargo bench --locked --bench solver_performance -- --test
      # Upload only after this repository has been connected to CodSpeed and
      # CODSPEED_ENABLED=true is configured as a repository variable. Fork and
      # Dependabot pull requests do not receive upload-capable OIDC tokens.
      - name: Run and upload benchmarks
        if: >-
          vars.CODSPEED_ENABLED == 'true' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          run: cargo codspeed run --bench solver_performance
