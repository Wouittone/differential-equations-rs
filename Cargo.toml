[package]
name = "differential-equations-rs"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Rust implementations of Julia SciML ODE solvers"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Wouittone/differential-equations-rs"
homepage = "https://github.com/Wouittone/differential-equations-rs"
documentation = "https://docs.rs/differential-equations-rs"
keywords = ["ode", "ode-solver", "numerical", "simulation", "sciml"]
categories = ["science", "mathematics", "algorithms", "simulation"]
include = [
    "/src/**/*.rs",
    "/src/tableau/resources/**/*.json",
    "/README.md",
    "/docs/BENCHMARKING.md",
    "/docs/RELEASING.md",
    "/docs/TABLEAU_RESOURCES.md",
    "/benches/comparison/rust_matrix.rs",
    "/benches/solver_performance.rs",
    "/examples/quickstart.rs",
    "/examples/tableau_from_file.rs",
    "/examples/resources/file_heun.json",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]
[lib]
name = "differential_equations"

[workspace]
members = ["tableau-core", "tableau-macros"]
exclude = [
    "tests/downstream/default-features",
    "tests/downstream/no-default-renamed",
]
resolver = "3"

[features]
# Shape-aware ndarray states are part of the core API and deliberately are not
# gated by a `vector`, `matrix`, or `ndarray` feature. `--no-default-features`
# disables only optional execution capabilities.
default = ["parallel"]
parallel = ["dep:rayon"]
# Repository benchmark instrumentation; not intended for application code.
allocation-metrics = []
serde = ["dep:serde"]

[dependencies]
differential-equations-tableau-macros = { version = "=1.0.0", path = "tableau-macros" }
differential-equations-tableau-core = { version = "=1.0.0", path = "tableau-core" }
ndarray = "0.17.2"
rayon = { version = "1.11.0", optional = true }
thiserror = "2.0.20"
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "5.0.0", default-features = false, features = ["cargo_bench_support"] }
stats_alloc = "0.1.10"
serde_json = "1.0"

[[bench]]
name = "stepping_costs"
harness = false

[[bench]]
name = "solver_performance"
harness = false
required-features = ["parallel"]

[[bench]]
name = "comparison_matrix"
path = "benches/comparison/rust_matrix.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings", "-D", "missing-docs"]
