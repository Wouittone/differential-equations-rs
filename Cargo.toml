[package]
name = "differential-equations"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.85"
description = "Beta Rust implementations of Julia SciML ODE solvers"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Wouittone/differential-equations-rs"
homepage = "https://github.com/Wouittone/differential-equations-rs"
documentation = "https://docs.rs/differential-equations"
keywords = ["ode", "differential-equations", "numerical", "simulation", "sciml"]
categories = ["science", "mathematics", "algorithms", "simulation"]
include = [
    "/src/**/*.rs",
    "/src/tableau/resources/**/*.json",
    "/README.md",
    "/docs/BENCHMARKING.md",
    "/docs/RELEASING.md",
    "/docs/TABLEAU_RESOURCES.md",
    "/benches/solver_performance.rs",
    "/examples/quickstart.rs",
    "/examples/tableau_from_file.rs",
    "/examples/resources/file_heun.json",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]
publish = false

[workspace]
members = ["tableau-core", "tableau-macros"]
resolver = "3"

[features]
default = ["parallel"]
allocation-metrics = []
parallel = ["dep:rayon"]

[dependencies]
differential-equations-tableau-macros = { version = "=0.1.0-beta.1", path = "tableau-macros" }
differential-equations-tableau-core = { version = "=0.1.0-beta.1", path = "tableau-core" }
ndarray = "0.17.2"
rayon = { version = "1.11.0", optional = true }
thiserror = "2.0.20"

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "5.0.0", default-features = false, features = ["cargo_bench_support"] }
stats_alloc = "0.1.10"
serde_json = "1.0"

[[bench]]
name = "solver_performance"
harness = false
required-features = ["parallel"]

[[bench]]
name = "comparison_matrix"
path = "benches/comparison/rust_matrix.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings", "-D", "missing-docs"]
