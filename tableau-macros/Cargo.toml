[package]
name = "differential-equations-tableau-macros"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.85"
description = "Compile-time tableau resources for differential-equations"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Wouittone/differential-equations-rs"
homepage = "https://github.com/Wouittone/differential-equations-rs"
documentation = "https://docs.rs/differential-equations-tableau-macros"
keywords = ["ode", "runge-kutta", "tableau", "procedural-macro"]
categories = ["science", "mathematics", "development-tools::procedural-macro-helpers"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
proc-macro = true

[dependencies]
differential-equations-tableau-core = { version = "=0.1.0-beta.1", path = "../tableau-core" }
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = "3.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings", "-D", "missing-docs"]
