[package]
name = "differential-equations-tableau-macros"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.85"
description = "Compile-time tableau resources for differential-equations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wouittone/differential-equations-rs"
homepage = "https://github.com/Wouittone/differential-equations-rs"
documentation = "https://docs.rs/differential-equations-tableau-macros"
include = ["/src/**/*.rs", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
syn = "3.0"
toml = "1.1"
